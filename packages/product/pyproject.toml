[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beo-product"
version = "0.1.0"
description = "What a Bang & Olufsen product is: identity, sources, play state, volume. Types only, no I/O"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tobias Laursen" }]
keywords = ["bang-olufsen", "beolink", "multiroom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/djerik/beo"
Repository = "https://github.com/djerik/beo"

[project.optional-dependencies]
test = ["pytest>=7"]

# PEP 420 native namespace package: beo/ carries no __init__.py.
[tool.setuptools.packages.find]
where = ["."]
include = ["beo.product*"]
namespaces = true

[tool.setuptools.package-data]
"beo.product" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
