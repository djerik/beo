[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beo-networklink"
version = "0.1.0"
description = "Bang & Olufsen NetworkLink: beocore XMPP sessions, FPS audio transport, PTP, mDNS discovery, the source and listener roles, the shared configuration and the nSDK client"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tobias Laursen" }]
keywords = ["bang-olufsen", "beolink", "networklink", "multiroom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = ["beo-product>=0.1,<0.2", "zeroconf>=0.148.0"]

[project.urls]
Homepage = "https://github.com/djerik/beo"
Repository = "https://github.com/djerik/beo"

[project.optional-dependencies]
test = ["pytest>=7"]

# PEP 420 native namespace package: beo/ carries no __init__.py, so several
# distributions can contribute to the same namespace. If any one of them ships
# that file, the others stop being importable.
[tool.setuptools.packages.find]
where = ["."]
include = ["beo.networklink*"]
namespaces = true

[tool.setuptools.package-data]
"beo.networklink" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
