[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beo-masterlink"
version = "0.1.0"
description = "Bang & Olufsen Master Link bus: telegram codec, serial transport, the music-system model and the source-centre role"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tobias Laursen" }]
keywords = ["bang-olufsen", "beolink", "masterlink", "multiroom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = ["beo-product>=0.1,<0.2", "pyserial>=3.4"]

[project.urls]
Homepage = "https://github.com/djerik/beo"
Repository = "https://github.com/djerik/beo"

[project.optional-dependencies]
test = ["pytest>=7"]

# PEP 420 native namespace package: beo/ carries no __init__.py, so several
# distributions can contribute to the same namespace. If any one of them ships
# that file, the others stop being importable.
[tool.setuptools.packages.find]
where = ["."]
include = ["beo.masterlink*"]
namespaces = true

[tool.setuptools.package-data]
"beo.masterlink" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
